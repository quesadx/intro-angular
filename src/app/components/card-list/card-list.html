<section class="flex flex-col gap-5 wrap">
    <div>
        <h1 class="text-3xl font-bold">Card List</h1>
        <p class="text-gray-600">A collection of cards displayed in a responsive grid layout.</p>
        <span class="text-2xl font-bold">Total $ {{total()}}</span>
    </div>

    <div class="flex gap-5 wrap">
        @for (card of cards(); track $index) {
            <app-card [product]="card"></app-card>
        }
    </div>
</section>
