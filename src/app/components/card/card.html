<section class="bg-white shadow-xl py-5 rounded-lg p-2 gap-2 max-w-sm flex flex-col items-center">
    <img src={{product?.imageUrl}} alt="Imagen ps">
    <h1 class="text-xl border-t-1 w-75 text-center">{{product?.name}}</h1>
    <p>{{product?.description}}</p>
    <div>
        <span>{{product?.qt}}</span>
        <span class="text-2xl font-bold">${{product?.price}}</span>
    </div>
    <button (click)="handleAddCart()" class="bg-blue-500 px-5 py-2 text-white rounded-lg">
        Add to Cart
    </button>
</section>
